version: "3.9"

# ================================================================
# Local development stack for the Loan Eligibility Flink demo
# ================================================================
# Starts a lightweight PostgreSQL instance.
# Kafka source: use Confluent Cloud trial or local Kafka separately.
#
# Usage:
#   docker compose up -d
#   docker compose down -v  (remove volumes / reset data)
# ================================================================

services:

  postgres:
    image: postgres:16-alpine
    container_name: loan-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: flink
      POSTGRES_PASSWORD: flink
      POSTGRES_DB: loan_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Auto-run the schema on first start
      - ./docs/postgres-schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U flink -d loan_db"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
